            bash_major: "5"
          - os: macos-latest
            bash_major: "3"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Unconditional, like the other harness jobs. The tests run each script from a
      # temp project dir with HOME on a temp dir, the way its SKILL.md calls it. They
      # need no ffmpeg, opencv, screen or network: installers and npm are stubbed.
      - name: Run demo-video script and wiring tests
        shell: /bin/bash {0}
        env:
          EXPECT_BASH_MAJOR: ${{ matrix.bash_major }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            mkdir -p "$RUNNER_TEMP/bash32"
            ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
            export PATH="$RUNNER_TEMP/bash32:$PATH"
          fi
          bash --version | head -1
          /usr/bin/env bash --version | head -1
          bash plugins/demo-video/tests/run-tests.sh
